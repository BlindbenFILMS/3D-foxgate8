<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="_ds/modernist-ae67aa6b-5da8-44ce-9255-829f1d75925f/styles.css">
<script src="_ds/modernist-ae67aa6b-5da8-44ce-9255-829f1d75925f/_ds_bundle.js"></script>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#201e1d}a{color:#f3f2f2}a:hover{color:var(--color-accent-300)}button:focus-visible{outline:2px solid var(--color-accent);outline-offset:2px}</style>
</helmet>
<div data-screen-label="Species Leaders" style="position:relative;width:100%;height:100vh;height:100dvh;overflow:hidden;background:var(--color-text);color:var(--color-bg);font-family:var(--font-body);display:flex;flex-direction:column">
  <div style="flex:none;display:flex;align-items:stretch;border-bottom:2px solid var(--color-bg);padding-top:env(safe-area-inset-top)">
    <div style="flex:1;min-width:0;padding:10px 16px;display:flex;flex-direction:column;gap:2px">
      <span style="font:800 11px var(--font-heading);letter-spacing:0.14em;color:var(--color-accent)">FOX FIGHTERS · THE 8 MOON PEOPLES</span>
      <span style="font:900 22px/1.05 var(--font-heading);letter-spacing:-0.01em">LEADERS IN SPECIES ARMOUR</span>
    </div>
    <button type="button" onClick="{{ toggleAll }}" style="flex:none;min-width:96px;padding:0 16px;border:0;border-left:2px solid var(--color-bg);border-radius:0;background:{{ allBg }};color:var(--color-bg);font:900 15px var(--font-heading);letter-spacing:0.06em;text-align:left;cursor:pointer">{{ allTxt }}</button>
  </div>
  <div style="position:relative;flex:1 1 auto;min-height:0">
    <div ref="{{ stageRef }}" style="position:absolute;inset:0"></div>
    <sc-if value="{{ oneOn }}" hint-placeholder-val="{{ true }}">
      <div style="position:absolute;left:0;bottom:0;max-width:min(420px,100%);background:var(--color-text);border-top:2px solid var(--color-bg);border-right:2px solid var(--color-bg);padding:12px 16px;display:flex;flex-direction:column;gap:4px;box-sizing:border-box">
        <span style="font:800 11px var(--font-heading);letter-spacing:0.12em;color:{{ cur.colour }}">{{ cur.moon }} · {{ cur.people }} · {{ cur.armour }}</span>
        <span style="font:900 26px/1 var(--font-heading)">{{ cur.name }}</span>
        <span style="font:800 12px var(--font-heading);letter-spacing:0.08em;color:#cfcac2">{{ cur.title }} · DRAFT FIGHTER</span>
        <span style="font:600 14px/1.35 var(--font-body);text-wrap:pretty">{{ cur.style }}</span>
        <span style="font:800 12px var(--font-heading);letter-spacing:0.06em;color:#ffd23a">{{ cur.specials }}</span>
      </div>
    </sc-if>
    <sc-if value="{{ loading }}" hint-placeholder-val="{{ true }}"><div style="position:absolute;left:16px;top:16px;font:800 14px var(--font-heading);letter-spacing:0.1em">{{ status }}</div></sc-if>
  </div>
  <div style="flex:none;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border-top:2px solid var(--color-bg);padding-bottom:env(safe-area-inset-bottom)">
    <sc-for list="{{ chips }}" as="c" hint-placeholder-count="8">
      <button type="button" onClick="{{ c.go }}" style="min-height:52px;padding:4px 10px;border:0;border-right:2px solid #3a3836;border-bottom:2px solid #3a3836;border-radius:0;background:{{ c.bg }};color:var(--color-bg);text-align:left;display:flex;flex-direction:column;justify-content:center;gap:1px;min-width:0;cursor:pointer">
        <span style="font:900 13px var(--font-heading);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ c.people }}</span>
        <span style="font:800 9px var(--font-heading);letter-spacing:0.08em;color:{{ c.colour }};white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ c.moon }}</span>
      </button>
    </sc-for>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { sel: 0, all: false, ready: false, status: 'LOADING THE LEADERS…', L: [] };
  stageRef = React.createRef();
  async componentDidMount() {
    try {
      const base = document.baseURI, I = p => import(new URL(p, base).href);
      const [THREE, VG, MG, FK, CA, SL, AS] = await Promise.all([I('vendor/three/three.module.js'), I('village-game.js'), I('meru-game.js'), I('fox-kit-moon.js?v=s776i'), I('engine/cast.js?v=s339c'), I('engine/species-leaders.js?v=1'), I('engine/armor-sets.js')]);
      if (this.dead) return; const el = this.stageRef.current, touch = matchMedia('(pointer: coarse)').matches;
      const renderer = new THREE.WebGLRenderer({ antialias: !touch, preserveDrawingBuffer: true }); renderer.setPixelRatio(Math.min(touch ? 1.5 : 2, devicePixelRatio)); renderer.domElement.style.cssText = 'display:block;width:100%;height:100%;touch-action:none'; el.appendChild(renderer.domElement);
      const scene = new THREE.Scene(); scene.background = new THREE.Color('#2a2826'); const cam = new THREE.PerspectiveCamera(36, 1, 0.1, 200);
      scene.add(new THREE.HemisphereLight(0xffffff, 0x6a5a48, 1.5)); const sun = new THREE.DirectionalLight(0xfff2d8, 1.8); sun.position.set(5, 10, 8); scene.add(sun);
      const grad = VG.makeGradient(), cache = new Map(), toon = (c, extra) => { const k = c + (extra ? JSON.stringify(extra) : ''); if (!cache.has(k)) cache.set(k, new THREE.MeshToonMaterial({ color: c, gradientMap: grad, ...extra })); return cache.get(k); };
      const outlineMat = new THREE.MeshBasicMaterial({ color: 0x1a1626, side: THREE.BackSide });
      const outline = (mesh, t = 0.04, radius) => { const g = mesh.geometry; g.computeBoundingBox(); const s = new THREE.Vector3(); g.boundingBox.getSize(s); const o = new THREE.Mesh(g, outlineMat); if (radius) o.scale.setScalar(1 + t / radius); else o.scale.set(1 + 2 * t / Math.max(s.x, 0.01), 1 + 2 * t / Math.max(s.y, 0.01), 1 + 2 * t / Math.max(s.z, 0.01)); mesh.add(o); return mesh; };
      const M = (geo, mat, x = 0, y = 0, z = 0, parent, ol = 0.04, radius) => { const m = new THREE.Mesh(geo, mat); m.position.set(x, y, z); if (ol) outline(m, ol, radius); (parent || scene).add(m); return m; };
      const kit = FK.foxKit({ THREE, scene, toon, M, grad, outlineMat, crestTex: MG.crestTex, rr: VG.rr, pick: VG.pick, clamp: VG.clamp, smooth: VG.smooth, damp: VG.damp, merge: true });
      const cast = CA.castKit({ THREE, M, toon, makeFox: kit.makeFox }, await CA.loadCastRigs().catch(() => ({})));
      const sets = AS.loadArmorSets(), ctx = { THREE, M, toon, cast, CAST: CA.CAST };
      const floor = new THREE.Mesh(new THREE.CircleGeometry(30, 48), new THREE.MeshToonMaterial({ color: '#3a3836', gradientMap: grad })); floor.rotation.x = -Math.PI / 2; scene.add(floor);
      const foxes = SL.LEADERS.map((L, i) => { const f = SL.makeLeader(ctx, L.id, sets); scene.add(f); const ring = new THREE.Mesh(new THREE.RingGeometry(0.9, 1.05, 40), new THREE.MeshBasicMaterial({ color: L.colour })); ring.rotation.x = -Math.PI / 2; ring.position.y = 0.01; f.add(ring); return f; });
      const L = SL.LEADERS.map(q => ({ ...q, armour: (sets[q.sp] && sets[q.sp].name) || '' }));
      Object.assign(this, { THREE, renderer, scene, cam, kit, foxes, el });
      const size = () => { const w = el.clientWidth || 1, h = el.clientHeight || 1; renderer.setSize(w, h, false); cam.aspect = w / h; cam.updateProjectionMatrix(); }; this.size = size; size(); this.ro = new ResizeObserver(size); this.ro.observe(el);
      let last = performance.now(), t = 0, yaw = 0, drag = null; this.yaw = 0;
      el.addEventListener('pointerdown', e => { drag = e.clientX; }); addEventListener('pointerup', this.pu = () => { drag = null; }); el.addEventListener('pointermove', e => { if (drag == null) return; this.yaw += (e.clientX - drag) * 0.01; drag = e.clientX; });
      const frame = now => { if (this.dead) return; this.raf = requestAnimationFrame(frame); const dt = Math.min(0.05, (now - last) / 1000); last = now; t += dt; this.step(dt, t); };
      this.step = (dt, t) => { const S = this.state, port = cam.aspect < 1;
        foxes.forEach((f, i) => { const all = S.all; f.visible = all || i === S.sel;
          if (all) { const cols = port ? 2 : 4, r = Math.floor(i / cols), c = i % cols; f.position.set((c - (cols - 1) / 2) * 2.6, 0, r * 3.4 - (port ? 5 : 1.7)); f.rotation.y = 0; }
          else { f.position.set(0, 0, 0); f.rotation.y = this.yaw + Math.sin(t * 0.4) * 0.35; }
          kit.animFox(f, dt, 0, false); const tk = f.userData.tickSpecies; if (tk) try { tk(f, dt); } catch (e) {} try { AS.tickArmor(f, t); } catch (e) {} });
        if (S.all) { cam.fov = 36; const halfW = port ? 3.4 : 6.4, d = Math.max(halfW / (Math.tan(cam.fov * Math.PI / 360) * cam.aspect), port ? 14 : 8) + (port ? 2 : 3); cam.position.set(0, d * 0.42, d + (port ? 0 : 1.7)); cam.lookAt(0, 1.3, port ? 0.2 : 0); }
        else { const s = this.foxes[S.sel].userData.leader.scale, hgt = 2.7 * s, sx = port ? 0 : -hgt * 0.32; cam.fov = port ? 40 : 34; const d = hgt * (port ? 1.8 : 1.68) / Math.tan(cam.fov * Math.PI / 360) / 2; cam.position.set(sx, hgt * 0.55, d); cam.lookAt(sx, hgt * (port ? 0.34 : 0.5), 0); }
        cam.updateProjectionMatrix(); renderer.render(scene, cam); };
      this.raf = requestAnimationFrame(frame); window.__leaders = { step: (n = 1) => { for (let i = 0; i < n; i++) this.step(1 / 30, (this._t = (this._t || 0) + 1 / 30)); }, pick: i => this.setState({ sel: i, all: false }), all: v => this.setState({ all: v }), foxes };
      this.setState({ ready: true, L });
    } catch (e) { console.error(e); this.setState({ status: 'DID NOT LOAD · ' + String((e && e.message) || e) }); }
  }
  componentWillUnmount() { this.dead = true; cancelAnimationFrame(this.raf); try { this.ro && this.ro.disconnect(); } catch (e) {} removeEventListener('pointerup', this.pu); try { this.renderer && this.renderer.dispose(); } catch (e) {} }
  renderVals() {
    const S = this.state, L = S.L[S.sel] || { colour: '#f3f2f2', moon: '', people: '', armour: '', name: '', title: '', fight: { style: '', specials: [] } };
    return {
      stageRef: this.stageRef, loading: !S.ready, status: S.status, oneOn: S.ready && !S.all,
      cur: { colour: L.colour, moon: L.moon, people: L.people, armour: L.armour, name: L.name, title: L.title, style: L.fight.style, specials: L.fight.specials.join(' · ') },
      allTxt: S.all ? 'ONE' : 'ALL 8', allBg: S.all ? 'var(--color-accent)' : 'var(--color-text)', toggleAll: () => this.setState(s => ({ all: !s.all })),
      chips: (S.L.length ? S.L : Array.from({ length: 8 }, () => ({ people: '', moon: '', colour: '#fff' }))).map((q, i) => ({ people: q.people, moon: q.moon, colour: q.colour, bg: !S.all && i === S.sel ? '#3a3836' : 'var(--color-text)', go: () => this.setState({ sel: i, all: false }) })),
    };
  }
}
</script>
</body>
</html>
