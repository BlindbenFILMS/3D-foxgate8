<!doctype html>
<html lang="en">
<head>

<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;700;800;900&amp;display=swap">
<style>body{margin:0;background:#000;overflow:hidden}a{color:#ffd23a}a:hover{color:#ffffff}</style>
</helmet>
<div style="width:844px;height:390px;overflow:hidden;background:#0b1430;color:#fff;font-family:Archivo, system-ui, sans-serif">

</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"autoDemo":{"editor":"boolean","default":true},"$preview":{"width":844,"height":390}}'>
class Component extends DCLogic {
  renderVals() {
    return { autoDemo: this.props.autoDemo ?? true };
  }
}
</script>
