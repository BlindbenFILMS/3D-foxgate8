<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Toy Workshop World Test</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;700;800;900&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#9fd3f2}
.wt{position:fixed;inset:0;overflow:hidden;font-family:'Archivo',system-ui,sans-serif;color:#fff}
.wt-stage{position:absolute;inset:0}
.wt-bar{position:absolute;left:8px;bottom:8px;display:flex;gap:6px;align-items:stretch;flex-wrap:wrap}
.wt-tag{background:#000;border:2px solid #3a3836;padding:8px 10px;font:700 12px/1.3 'Archivo',system-ui,sans-serif;letter-spacing:.08em}
.wt-btn{min-height:44px;background:#ec3013;color:#fff;border:2px solid #ec3013;border-radius:0;font:800 13px/1 'Archivo',system-ui,sans-serif;letter-spacing:.06em;text-align:left;padding:0 14px;cursor:pointer}
</style>
</helmet>
<div class="wt" data-wt-root="1">
  <div class="wt-stage" data-wt-stage="1"></div>
  <sc-if value="{{closed}}" hint-placeholder-val="{{ false }}">
    <div class="wt-bar">
      <span class="wt-tag">TOWN VIEW · TOWN TAPS {{taps}}</span>
      <button class="wt-btn" type="button" onClick="{{open}}">PLAY TOY WORKSHOP</button>
    </div>
  </sc-if>
  <sc-if value="{{playing}}" hint-placeholder-val="{{ false }}">
    <div class="wt-bar" style="left: auto; right: 8px; bottom: auto; top: 50%; pointer-events: none">
      <span class="wt-tag">WORLD MODE · TOWN TAPS {{taps}}</span>
    </div>
  </sc-if>
  <sc-if value="{{hasWorld}}" hint-placeholder-val="{{ false }}">
    <dc-import name="Main" world="{{world}}" hint-size="100%,100%"></dc-import>
  </sc-if>
  <sc-if value="{{hasErr}}" hint-placeholder-val="{{ false }}">
    <div class="wt-tag" style="position: absolute; left: 12px; right: 12px; top: 40%; background: #ec3013">World test could not load: {{err}}</div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"moduleUrl":{"editor":null,"tsType":"string"},"$preview":{"width":1280,"height":720}}'>
class Component extends DCLogic {
  state = { world: null, playing: false, taps: 0, err: null };

  moduleUrls() {
    /* where the game module lives: a prop, the host's resource map, a canvas copy, or the folder next to this page */
    const out = [];
    if (this.props.moduleUrl) out.push(this.props.moduleUrl);
    const R = window.__resources || {};
    for (const k in R) if (/toy-workshop(\.bundle)?\.js$/.test(k) && typeof R[k] === 'string') out.push(R[k]);
    const CANVAS_BUNDLE = 'blob/e50ccae645c458e4f3527715a186a880.js';
    if (CANVAS_BUNDLE) out.push(CANVAS_BUNDLE);
    try { out.push(new URL('./minigames/toy-workshop/toy-workshop.js', document.baseURI).href); } catch (e) { /* no base url */ }
    return out;
  }
  async loadModule() {
    let last = null;
    for (const u of this.moduleUrls()) {
      try { const m = await import(u); if (m && (m.createToyWorkshop || m.default)) return m; } catch (e) { last = e; }
    }
    throw last || new Error('game module not found');
  }

  async componentDidMount() {
    const root = document.querySelector('[data-wt-root]');
    const stage = root.querySelector('[data-wt-stage]');
    let mod;
    try { mod = await this.loadModule(); } catch (e) { this.setState({ err: String(e && e.message || e) }); return; }
    if (this._dead) return;
    const THREE = mod.THREE || await import(new URL('./vendor/three/three.module.js', document.baseURI).href).catch(() => null);
    if (!THREE) { this.setState({ err: 'three.js not found' }); return; }
    this.mod = mod;

    /* a tiny town: ground, sky colour, light, some houses */
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.domElement.style.cssText = 'display:block;width:100%;height:100%;touch-action:none';
    stage.appendChild(renderer.domElement);
    const town = new THREE.Scene(); town.background = new THREE.Color('#9fd3f2');
    town.add(new THREE.HemisphereLight(0xffffff, 0x5c7a3a, 1.4));
    const sun = new THREE.DirectionalLight(0xfff1d6, 1.6); sun.position.set(-10, 20, 8); town.add(sun);
    const ground = new THREE.Mesh(new THREE.PlaneGeometry(200, 200), new THREE.MeshLambertMaterial({ color: '#7fb04a' }));
    ground.rotation.x = -Math.PI / 2; town.add(ground);
    const cols = ['#e9c46a', '#f4a261', '#e76f51', '#8ab6d6', '#c9ada7'];
    for (let i = 0; i < 14; i++) {
      const a = i / 14 * Math.PI * 2, r = 32 + (i % 3) * 6;
      const house = new THREE.Mesh(new THREE.BoxGeometry(5, 4 + (i % 4), 5), new THREE.MeshLambertMaterial({ color: cols[i % 5] }));
      house.position.set(Math.cos(a) * r, house.geometry.parameters.height / 2, Math.sin(a) * r); town.add(house);
      const roof = new THREE.Mesh(new THREE.ConeGeometry(4.2, 2.5, 4), new THREE.MeshLambertMaterial({ color: '#7a3b2e' }));
      roof.position.set(house.position.x, house.geometry.parameters.height + 1.25, house.position.z); roof.rotation.y = Math.PI / 4; town.add(roof);
    }
    /* the play area's parent group, offset and rotated like a real town slot */
    const parent = new THREE.Group(); parent.position.set(20, 0, -15); parent.rotation.y = 0.9; town.add(parent);
    const pad = new THREE.Mesh(new THREE.CircleGeometry(7, 40), new THREE.MeshLambertMaterial({ color: '#c9b48a' }));
    pad.rotation.x = -Math.PI / 2; pad.position.y = 0.01; parent.add(pad);

    const townCam = new THREE.PerspectiveCamera(50, 1, 0.1, 500);
    townCam.position.set(-6, 22, 40); townCam.lookAt(14, 0, -12);
    const freePos = townCam.position.clone(), freeQ = townCam.quaternion.clone();

    this.three = { THREE, renderer, town, parent, townCam };
    const onTownDown = (e) => { if (e.target === renderer.domElement) this.setState({ taps: this.state.taps + 1 }); };
    window.addEventListener('pointerdown', onTownDown);
    const onKey = (e) => { const api = this.api; if (api && !(e.target && /input|textarea/i.test(e.target.tagName))) { if (e.key === ' ') e.preventDefault(); api.key(e); } };
    window.addEventListener('keydown', onKey); window.addEventListener('keyup', onKey);
    this._cleanup = () => { window.removeEventListener('pointerdown', onTownDown); window.removeEventListener('keydown', onKey); window.removeEventListener('keyup', onKey); };

    const loop = () => {
      if (this._dead) return;
      this._raf = requestAnimationFrame(loop);
      const w = stage.clientWidth || 1, h = stage.clientHeight || 1;
      if (renderer.domElement.width !== Math.round(w * renderer.getPixelRatio())) renderer.setSize(w, h, false);
      townCam.aspect = w / h;
      const api = this.api;
      if (api) {
        const c = api.camera;
        townCam.position.lerp(c.position, 0.12); townCam.quaternion.slerp(c.quaternion, 0.12);
      } else {
        townCam.position.lerp(freePos, 0.06); townCam.quaternion.slerp(freeQ, 0.06);
      }
      townCam.updateProjectionMatrix();
      renderer.render(town, townCam);
    };
    loop();
    this.open();
  }

  async open() {
    if (!this.mod || this.api) return;
    const { renderer, parent, townCam } = this.three;
    const api = await this.mod.createToyWorkshop({
      container: null,
      onState: (h) => window.dispatchEvent(new CustomEvent('8g:toyWorkshop', { detail: h })),
      opts: { world: { renderer, camera: townCam, parent } },
    });
    this.api = api;
    const world = {
      _toyWorkshop: {
        g: () => this.api,
        end: () => {
          if (!this.api) return;
          this.api.destroy(); this.api = null;
          window.dispatchEvent(new CustomEvent('8g:toyWorkshop', { detail: null }));
          this.setState({ playing: false });
        },
      },
    };
    this.setState({ world, playing: true });
  }

  componentWillUnmount() {
    this._dead = true; cancelAnimationFrame(this._raf);
    if (this._cleanup) this._cleanup();
    if (this.api) this.api.destroy();
    if (this.three) { this.three.renderer.dispose(); this.three.renderer.domElement.remove(); }
  }

  renderVals() {
    return {
      world: this.state.world,
      hasWorld: !!this.state.world,
      playing: this.state.playing,
      closed: !!this.state.world && !this.state.playing,
      taps: this.state.taps,
      open: () => this.open(),
      hasErr: !!this.state.err, err: this.state.err || '',
    };
  }
}
</script>
</body>
</html>
