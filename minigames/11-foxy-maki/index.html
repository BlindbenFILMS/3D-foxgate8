<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Foxy Maki</title>
<style>
/* One screen: the game fills the whole frame. Single dark look to match the game's black HUD. */
:root { --bg: #000; --fg: #f7f4ec; --muted: #cfcac4; --accent: #ffd23a; color-scheme: dark; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 600 14px/1.4 Archivo, system-ui, sans-serif; overflow: hidden; }
.stage { position: relative; height: 100%; width: 100%; }
.stage iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; display: block; background: var(--bg); }
.loading { position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: center; gap: 6px; padding-inline: 24px; pointer-events: none; z-index: 1; background: var(--bg); }
.loading b { color: var(--accent); letter-spacing: 0.12em; font-size: 12px; }
.loading span { color: var(--muted); }
</style>
<div class="stage">
  <div class="loading" id="loading"><b>KYOTO · FOXY MAKI</b><span>Warming the rice… the 3D counter takes a few seconds to load.</span></div>
  <iframe id="game" src="game.dc.html" title="Foxy Maki sushi shift" allow="fullscreen; autoplay"></iframe>
</div>
<script>
  document.getElementById('game').addEventListener('load', function () { setTimeout(function () { var l = document.getElementById('loading'); if (l) l.hidden = true; }, 2500); });
</script>

</body></html>
