<title>FOX Gelato</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;800;900&display=swap">
<style>
:root{--y:#ffd23a;--r:#ec3013;--ink:#000;--rule:#3a3836;--rule2:#2a2826;--mut:#cfcac4;--gold:#e6b45a;--grn:#22c55e;--fh:'Archivo','Arial Black',Arial,sans-serif;--fb:'Archivo',Arial,sans-serif}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#000;color-scheme:dark;color:#fff;font-family:var(--fb);-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
#app{position:fixed;inset:0;overflow:hidden;touch-action:none}
#stage{position:absolute;inset:0}
button{font-family:var(--fh);border-radius:0;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
button:focus-visible{outline:2px solid var(--r);outline-offset:2px}
.abs{position:absolute}
.k{font:800 10px var(--fh);letter-spacing:.12em;color:var(--y)}
.panel{background:#000;border:2px solid var(--y)}
/* shift top bar */
#top{left:0;right:0;top:0;z-index:3;pointer-events:none;display:flex;flex-direction:column}
.bar{background:#000;border-bottom:2px solid var(--y);display:flex;align-items:stretch;padding-top:env(safe-area-inset-top)}
.cell{padding:6px 12px;display:flex;flex-direction:column;justify-content:center;border-right:2px solid var(--rule);min-width:0}
.cell b{font:900 18px var(--fh);font-variant-numeric:tabular-nums;white-space:nowrap}
.help{pointer-events:auto;flex:none;margin-left:auto;width:52px;border:0;border-left:2px solid var(--rule);background:#000;color:var(--y);font:900 20px var(--fh)}
.tix{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;padding:6px;align-items:start}
.tk{background:#fbfbf7;color:#201e1d;border:2px solid #201e1d;display:flex;flex-direction:column;min-width:0}
.tk .n{background:#d8405a;color:#fff;padding:3px 6px;font:900 11px var(--fh);letter-spacing:.06em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tk .p{height:5px;background:#e8e4da}.tk .p i{display:block;height:100%}
.tk .l{padding:2px 6px;border-top:1px solid #e8e4da;font:800 10px var(--fh);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:5px}
.dot{flex:none;width:10px;height:10px;border-radius:50%;border:1.5px solid #201e1d;display:inline-block}
/* station bar */
#sbar{left:0;right:0;bottom:0;z-index:4;background:#000;border-top:2px solid var(--y);padding:0 env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);display:grid;grid-template-columns:repeat(5,minmax(0,1fr))}
#sbar button{min-height:58px;padding:6px 3px 6px 8px;border:0;border-right:2px solid var(--rule2);background:#000;color:#fff;text-align:left;display:flex;flex-direction:column;justify-content:center;gap:3px;min-width:0}
#sbar button span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#sbar .s1{font:900 13px var(--fh)}#sbar .s2{font:800 9px var(--fh);letter-spacing:.06em;color:#8a847e}
/* overlays */
#tray{right:max(10px,env(safe-area-inset-right));z-index:3;pointer-events:none;max-width:min(260px,62%);display:flex;flex-direction:column}
#tray .h{padding:4px 10px;border-bottom:2px solid var(--rule);font:800 10px var(--fh);letter-spacing:.12em;color:var(--y)}
#tray .b{padding:6px 10px;display:flex;flex-wrap:wrap;align-items:center;gap:4px 6px;font:700 13px var(--fb);line-height:1.3}
.meter{left:50%;transform:translateX(-50%);z-index:5;pointer-events:none;width:min(420px,calc(100% - 24px))}
.flash{left:50%;transform:translateX(-50%);z-index:5;pointer-events:none;max-width:calc(100% - 24px);background:rgba(0,0,0,.9);display:flex;align-items:stretch}
.card{background:#000;border:2px solid var(--rule);display:flex;flex-direction:column}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;padding:7px 16px;border-bottom:2px solid var(--rule2);font:700 14px var(--fb)}
.row b{font-family:var(--fh);font-weight:800}
.bigbtn{min-height:56px;padding:0 18px;border:0;background:var(--r);color:#fff;font:900 16px var(--fh);letter-spacing:.1em;text-align:left}
.ghost{min-height:48px;padding:0 18px;border:0;border-top:2px solid var(--rule);background:#000;color:var(--y);font:900 14px var(--fh);letter-spacing:.1em;text-align:left}
.scrim{position:absolute;inset:0;background:rgba(0,0,0,.78);display:flex;align-items:center;padding:12px;overflow:auto}
.coin{min-width:64px;min-height:56px;padding:0 14px;border:2px solid var(--gold);background:#1a1612;color:var(--gold);font:900 20px var(--fh);text-align:left}
/* walk HUD */
#walk{position:absolute;inset:0;z-index:6;pointer-events:none}
#walk .wtop{position:absolute;left:0;right:0;top:0;background:#000;border-bottom:2px solid var(--y);padding:env(safe-area-inset-top) 0 0;display:flex;align-items:stretch;pointer-events:auto}
#walk .wq{flex:1;min-width:0;padding:8px 12px;display:flex;flex-direction:column;gap:2px;border-right:2px solid var(--rule)}
#walk .wq b{font:700 13px var(--fb);line-height:1.25}
#walk .wen{width:84px;padding:8px 12px;display:flex;flex-direction:column;justify-content:center;gap:5px;border-right:2px solid var(--rule)}
#walk .wen i{display:block;height:8px;background:#38bdf8}
.wmenu{border:0;background:#000;color:var(--y);font:900 11px var(--fh);letter-spacing:.06em;padding:0 10px;min-width:56px}
#stick{position:absolute;left:max(18px,env(safe-area-inset-left));bottom:calc(22px + env(safe-area-inset-bottom));width:140px;height:140px;border-radius:50%;background:rgba(0,0,0,.35);border:2px solid rgba(255,255,255,.55);pointer-events:auto;touch-action:none}
#knob{position:absolute;left:43px;top:43px;width:54px;height:54px;border-radius:50%;background:rgba(255,255,255,.85);border:2px solid #000}
.rb{position:absolute;border-radius:50%;background:#000;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font:900 11px var(--fh);letter-spacing:.04em;pointer-events:auto;touch-action:none}
.rb:active{filter:brightness(1.4)}
.rb small{font:900 9px var(--fh);color:var(--y)}
#bTaste{right:max(18px,env(safe-area-inset-right));bottom:calc(22px + env(safe-area-inset-bottom));width:84px;height:84px;border:5px solid #38bdf8}
#bWave{right:calc(max(18px,env(safe-area-inset-right)) + 92px);bottom:calc(14px + env(safe-area-inset-bottom));width:62px;height:62px;border:4px solid var(--r)}
#bHop{right:calc(max(18px,env(safe-area-inset-right)) + 14px);bottom:calc(116px + env(safe-area-inset-bottom));width:58px;height:58px;border:3px solid #fff}
#bTalk{right:calc(max(18px,env(safe-area-inset-right)) + 10px);bottom:calc(184px + env(safe-area-inset-bottom));width:66px;height:66px;border:4px solid var(--y);color:var(--y);font-size:13px}
#wprompt{left:50%;transform:translateX(-50%);bottom:calc(178px + env(safe-area-inset-bottom));padding:8px 14px;font:800 15px var(--fb);white-space:nowrap}
#wtoast{left:50%;transform:translateX(-50%);padding:10px 14px;font:700 14px var(--fb);max-width:calc(100% - 24px);pointer-events:auto}
#wdlg{left:max(12px,env(safe-area-inset-left));right:max(12px,env(safe-area-inset-right));bottom:max(12px,env(safe-area-inset-bottom));max-width:520px;max-height:62%;overflow:auto;pointer-events:auto;display:flex;flex-direction:column}
#wdlg .dh{position:relative;display:flex;align-items:baseline;gap:10px;padding:10px 56px 8px 16px;border-bottom:2px solid var(--rule)}
#wdlg .dx{position:absolute;top:0;right:0;width:44px;height:44px;border:0;border-left:2px solid var(--rule);border-bottom:2px solid var(--rule);background:var(--r);color:#fff;font:900 16px var(--fh)}
#wdlg .ch{display:grid;grid-template-columns:28px 1fr;gap:10px;min-height:48px;padding:12px 16px;border:0;border-bottom:2px solid var(--rule);background:#000;color:#fff;text-align:left;font:700 15px/1.35 var(--fb)}
@media (orientation:landscape) and (max-height:520px){#stick{width:120px;height:120px}#knob{left:33px;top:33px}#bTalk{right:calc(max(18px,env(safe-area-inset-right)) + 104px);bottom:calc(90px + env(safe-area-inset-bottom))}#wprompt{bottom:calc(24px + env(safe-area-inset-bottom))}#wdlg{max-width:440px;max-height:72%}}
</style>
<div id="app">
  <div id="stage"></div>
  <div id="ui"></div>
  <div id="sbar" class="abs" style="display:none"></div>
  <div id="walk" style="display:none">
    <div class="wtop"><div class="wq"><span class="k" id="wPlace">FOX GELATO</span><b id="wQuest">Talk to Pippa to work a shift</b></div><div class="wen"><span class="k">EN</span><div style="height:8px;background:var(--rule)"><i id="wEn" style="width:100%"></i></div></div><button class="wmenu" id="wSnd" data-act="snd" aria-label="Sound on or off" style="border-right:2px solid var(--rule)">SOUND</button><button class="wmenu" data-act="toIntro" aria-label="Back to the welcome card to start a shift">WORK</button></div>
    <div id="wtoast" class="abs panel" style="display:none" data-act="clearToast"></div>
    <div id="wprompt" class="abs panel" style="display:none"></div>
    <div id="stick" aria-label="Move"><div id="knob"></div></div>
    <div id="bTalk" class="rb" role="button" aria-label="Talk" data-hold="talk" style="display:none">TALK</div>
    <div id="bHop" class="rb" role="button" aria-label="Hop" data-hold="jump"><small>3</small>HOP</div>
    <div id="bWave" class="rb" role="button" aria-label="Wave" data-hold="melee"><small>1</small>WAVE</div>
    <div id="bTaste" class="rb" role="button" aria-label="Taste" data-hold="range"><small>2</small>TASTE</div>
    <div id="wdlg" class="abs panel" style="display:none"></div>
  </div>
</div>

Before any fox wrote anything down, we did not walk. We flew. It is in the scrolls in that library, and the library is the only one of us that has never once lied: there was an age when foxes crossed the dark as balls of light, and the stars were not scenery. They were a road.

[quieter] Now. The vein.

The stone in that mountain is light that has been sitting still for four hundred years. It is sacred. It is not a price. Cut it for a lamp in a hut. Cut it for the glass over the gorge. Cut it so a cleric can read after dark \u2014 and the Gate keeps. But cut it for gain, and I promise you: it goes dark in the hand. And so do you.

[warmer] And play. I mean that. It is doctrine, not a kindness. We have hit a ball across a net on this planet for a century without once agreeing to count the points \u2014 and we are the happiest world through that Gate. A fox at play is a fox telling the truth.

One more thing, and then go.

There is a homeworld. It is called Earth. Every fox here came from it, and every fox here returns to it \u2014 and not as a passenger.

As a light.
